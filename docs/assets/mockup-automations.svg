<svg width="1160" height="560" viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="durin Automations mockup: standing triggers that fire workflows, deliver results, pause for approvals, and switch off when their goal is achieved">
